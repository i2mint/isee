name: "PyPI Upload"
description: "Upload distributions to PyPI using twine"

inputs:
  pypi-username:
    description: "PyPI username (use __token__ for token-based auth)"
    required: true
  pypi-password:
    description: "PyPI password or token"
    required: true
  repository-url:
    description: "PyPI repository URL (defaults to pypi.org, use https://test.pypi.org/legacy/ for test)"
    required: false
    default: "https://upload.pypi.org/legacy/"
  packages-path:
    description: "Path to packages to upload (glob pattern)"
    required: false
    default: "dist/*"
  skip-existing:
    description: "Skip files that already exist on PyPI"
    required: false
    default: "false"
  verbose:
    description: "Verbose output"
    required: false
    default: "true"
  allow-skip:
    description: "When twine skips files that already exist on PyPI (nothing new is
      published), warn instead of failing the step. Default: fail, so a release
      that did not happen is never a green run (i2mint/isee#26)."
    required: false
    default: "false"

runs:
  using: 'composite'
  steps:
    - name: Install Twine
      shell: bash
      run: |
        set -e
        echo "Installing twine"
        python -m pip install --upgrade twine

    - name: Upload to PyPI
      shell: bash
      env:
        ALLOW_SKIP: ${{ inputs.allow-skip }}
      run: |
        set -e

        twine_args="--non-interactive"

        if [ "${{ inputs.verbose }}" = "true" ]; then
          twine_args="$twine_args --verbose"
        fi

        if [ "${{ inputs.skip-existing }}" = "true" ]; then
          twine_args="$twine_args --skip-existing"
        fi

        echo "Uploading packages from: ${{ inputs.packages-path }}"
        echo "Repository URL: ${{ inputs.repository-url }}"

        bash "${{ github.action_path }}/../_shared/twine-upload-checked.sh" \
          $twine_args \
          --repository-url "${{ inputs.repository-url }}" \
          --username "${{ inputs.pypi-username }}" \
          --password "${{ inputs.pypi-password }}" \
          ${{ inputs.packages-path }}

        echo "Upload complete!"
