name: "Publish"
description: "Publish package to Pypi"
inputs:
  pypi-username:
    description: "Pypi account username"
    required: true
  pypi-password:
    description: "Pypi account password"
    required: true
  package-path:
    description: "Path to the package(s) to publish. By default, all packages in the 
      dist folder are published."
    required: false
    default: "./dist/*"
  twine-args:
    description: "Additional arguments to pass to twine. Defaults to 
      '--non-interactive --disable-progress-bar --verbose'. See 
      https://twine.readthedocs.io/en/latest/#twine-upload-command for more 
      information."
    required: false
    default: "--non-interactive --disable-progress-bar --verbose"
  allow-skip:
    description: "When twine skips files that already exist on PyPI (nothing new is
      published), warn instead of failing the step. Default: fail, so a release
      that did not happen is never a green run (i2mint/isee#26)."
    required: false
    default: "false"
runs:
  using: 'composite'
  steps:
    - name: Install Dependencies
      uses: i2mint/isee/actions/install-packages@master
      with:
        pypi-packages: 'twine'
    - name: Publish to Pypi
      shell: bash
      env:
        ALLOW_SKIP: ${{ inputs.allow-skip }}
      run: |
        set -e
        bash "${{ github.action_path }}/../_shared/twine-upload-checked.sh" ${{ inputs.package-path }} -u ${{ inputs.pypi-username }} -p ${{ inputs.pypi-password }} ${{ inputs.twine-args }}
